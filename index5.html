<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <table>
        <caption>Horários das aulas da semana</caption>
        <thead> <!--Cabeça da Tabela-->
            <tr>
                <th scope="col">Dia da Semana</th>
                <th scope="col">Unidade Curricular</th>
                <th scope="col">Horário</th>
            </tr>
        </thead>
        <tbody> <!--Corpo da Tabela-->
            <tr>
                <td>Segunda-Feira</td>
                <td></td>
                <td></td>
            </tr>

            <tr>
                <td>Terça-Feira</td>
                <td>Codificação para Front-End</td>
                <td>14:00 as 17:00</td>
            </tr>
        </tbody>
        <tfoot> <!--Rodapé da Tabela-->
            <tr>
                <td colspan="3">Intervalo: 15:15 às 15:30</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
