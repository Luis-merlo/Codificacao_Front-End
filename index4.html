<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <!--Listas Não numeradas / Não ordenadas-->
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <!--Listas Númeradas / Ordenadas-->
    <ol>
        <li>Parênteses</li>
        <li>Divisão</li>
        <li>Multiplicação</li>
        <li>Adição</li>
        <li>Subtração</li>
    </ol>
    <!-- <ol type=""></ol> Definir o tipo de marcador A, a, i, I, 1 -->
    <!-- <ol start="2"></ol> Definir o numro inicial da lista -->
    <!-- <ol reserved></ol> Contagem decrescente -->
    <!-- Lista de Descrição (Glossário/FAQ) -->
    <dl>
    <!--Exemplo- de Menu-->
    <nav aria-label="Menu Principal">
        <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#sobre">Sobre</a></li>
        </ul>
    </nav>
    </dl>
</body>
</html>
